name: Build MancsBot KITT AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q MancsBot-KITT-Android-source.zip -d work
          test -f work/MancsBot-KITT-Android/app/build.gradle

      - name: Build AI Strategy Lab frontend
        working-directory: ai-web
        run: |
          npm install
          npm run build

      - name: Install AI frontend into Android assets
        run: |
          rm -rf work/MancsBot-KITT-Android/app/src/main/assets/www
          mkdir -p work/MancsBot-KITT-Android/app/src/main/assets/www
          cp -R ai-web/dist/. work/MancsBot-KITT-Android/app/src/main/assets/www/
          test -f work/MancsBot-KITT-Android/app/src/main/assets/www/index.html

      - name: Use conflict-free AI application id
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("work/MancsBot-KITT-Android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          text = text.replace("applicationId 'hu.nagydaniel.mancsbot'", "applicationId 'hu.nagydaniel.mancsbot.ai'")
          text = text.replace("versionCode 1", "versionCode 3")
          text = text.replace("versionCode 2", "versionCode 3")
          text = text.replace("versionName '1.0'", "versionName '1.2.0-ai'")
          text = text.replace("versionName '1.1.0-ai'", "versionName '1.2.0-ai'")
          gradle.write_text(text, encoding="utf-8")

          manifest = Path("work/MancsBot-KITT-Android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          m = m.replace('android:name=".MainActivity"', 'android:name="hu.nagydaniel.mancsbot.MainActivity"')
          m = m.replace('android:label="MancsBot KITT"', 'android:label="MancsBot KITT AI"')
          manifest.write_text(m, encoding="utf-8")
          PY

      - name: Verify package and author
        run: |
          grep -q "applicationId 'hu.nagydaniel.mancsbot.ai'" work/MancsBot-KITT-Android/app/build.gradle
          grep -q 'android:name="hu.nagydaniel.mancsbot.MainActivity"' work/MancsBot-KITT-Android/app/src/main/AndroidManifest.xml
          grep -q "Készítette: Nagy Dániel" work/MancsBot-KITT-Android/app/src/main/java/hu/nagydaniel/mancsbot/MainActivity.java
          grep -q "Minden jog fenntartva" work/MancsBot-KITT-Android/app/src/main/java/hu/nagydaniel/mancsbot/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: work/MancsBot-KITT-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp work/MancsBot-KITT-Android/app/build/outputs/apk/debug/app-debug.apk MancsBot-KITT-AI-Install-Fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MancsBot-KITT-AI-Install-Fix
          path: MancsBot-KITT-AI-Install-Fix.apk
          if-no-files-found: error
