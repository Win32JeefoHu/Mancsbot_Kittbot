name: Build MancsBot KITT AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q MancsBot-KITT-Android-source.zip -d work
          test -f work/MancsBot-KITT-Android/app/build.gradle

      - name: Build AI Strategy Lab frontend
        working-directory: ai-web
        run: |
          npm install
          npm run build

      - name: Install AI frontend into Android assets
        run: |
          rm -rf work/MancsBot-KITT-Android/app/src/main/assets/www
          mkdir -p work/MancsBot-KITT-Android/app/src/main/assets/www
          cp -R ai-web/dist/. work/MancsBot-KITT-Android/app/src/main/assets/www/
          test -f work/MancsBot-KITT-Android/app/src/main/assets/www/index.html

      - name: Install native KITT home widget
        run: |
          APP=work/MancsBot-KITT-Android/app/src/main
          mkdir -p "$APP/java/hu/nagydaniel/mancsbot" "$APP/res/layout" "$APP/res/xml" "$APP/res/drawable" "$APP/res/values"
          cp android-widget/KittWidgetProvider.java "$APP/java/hu/nagydaniel/mancsbot/KittWidgetProvider.java"
          cp android-widget/widget_kitt.xml "$APP/res/layout/widget_kitt.xml"
          cp android-widget/widget_kitt_info.xml "$APP/res/xml/widget_kitt_info.xml"
          cp android-widget/widget_kitt_bg.xml "$APP/res/drawable/widget_kitt_bg.xml"
          cp android-widget/widget_kitt_chip.xml "$APP/res/drawable/widget_kitt_chip.xml"
          cp android-widget/widget_kitt_button.xml "$APP/res/drawable/widget_kitt_button.xml"
          cp android-widget/widget_kitt_logo.xml "$APP/res/drawable/widget_kitt_logo.xml"

          python3 - <<'PY'
          from pathlib import Path
          app = Path("work/MancsBot-KITT-Android/app/src/main")

          # Add widget description resource without depending on the original strings.xml shape.
          strings = app / "res/values/kitt_widget_strings.xml"
          strings.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="kitt_widget_description">KITT AI Trading élő státusz, árfolyamok és AI Lab widget</string>
          </resources>
          """, encoding="utf-8")

          manifest = app / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          if "KittWidgetProvider" not in text:
              receiver = """
              <receiver
                  android:name="hu.nagydaniel.mancsbot.KittWidgetProvider"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/widget_kitt_info" />
              </receiver>
              """
              text = text.replace("</application>", receiver + "\n</application>")

          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n<application', 1)

          manifest.write_text(text, encoding="utf-8")
          PY

          grep -q "KittWidgetProvider" "$APP/AndroidManifest.xml"
          test -f "$APP/res/layout/widget_kitt.xml"
          test -f "$APP/res/xml/widget_kitt_info.xml"

      - name: Use conflict-free AI application id
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("work/MancsBot-KITT-Android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          text = text.replace("applicationId 'hu.nagydaniel.mancsbot'", "applicationId 'hu.nagydaniel.mancsbot.ai'")
          for n in ("1","2","3","4"):
              text = text.replace(f"versionCode {n}", "versionCode 4")
          for v in ("1.0","1.1.0-ai","1.2.0-ai"):
              text = text.replace(f"versionName '{v}'", "versionName '1.3.0-widget'")
          gradle.write_text(text, encoding="utf-8")

          manifest = Path("work/MancsBot-KITT-Android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          m = m.replace('android:name=".MainActivity"', 'android:name="hu.nagydaniel.mancsbot.MainActivity"')
          m = m.replace('android:label="MancsBot KITT"', 'android:label="MancsBot KITT AI"')
          manifest.write_text(m, encoding="utf-8")
          PY

      - name: Verify package widget and author
        run: |
          grep -q "applicationId 'hu.nagydaniel.mancsbot.ai'" work/MancsBot-KITT-Android/app/build.gradle
          grep -q "versionCode 4" work/MancsBot-KITT-Android/app/build.gradle
          grep -q "versionName '1.3.0-widget'" work/MancsBot-KITT-Android/app/build.gradle
          grep -q 'android:name="hu.nagydaniel.mancsbot.MainActivity"' work/MancsBot-KITT-Android/app/src/main/AndroidManifest.xml
          grep -q "KittWidgetProvider" work/MancsBot-KITT-Android/app/src/main/AndroidManifest.xml
          grep -q "Készítette: Nagy Dániel" work/MancsBot-KITT-Android/app/src/main/java/hu/nagydaniel/mancsbot/MainActivity.java
          grep -q "Minden jog fenntartva" work/MancsBot-KITT-Android/app/src/main/java/hu/nagydaniel/mancsbot/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: work/MancsBot-KITT-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp work/MancsBot-KITT-Android/app/build/outputs/apk/debug/app-debug.apk MancsBot-KITT-AI-Widget-v1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MancsBot-KITT-AI-Widget-v1.3
          path: MancsBot-KITT-AI-Widget-v1.3.apk
          if-no-files-found: error
