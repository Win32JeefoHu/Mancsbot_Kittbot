name: Build MancsBot KITT AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-ai-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q MancsBot-KITT-Android-source.zip -d work
          test -f work/MancsBot-KITT-Android/app/build.gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build AI dashboard
        working-directory: ai-web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install AI dashboard into Android assets
        run: |
          rm -rf work/MancsBot-KITT-Android/app/src/main/assets/www
          mkdir -p work/MancsBot-KITT-Android/app/src/main/assets/www
          cp -a ai-web/dist/. work/MancsBot-KITT-Android/app/src/main/assets/www/
          grep -q "AI Strategy Lab" ai-web/src/pages/AIStrategyLab.jsx
          grep -q "Nagy Dániel" work/MancsBot-KITT-Android/app/src/main/java/hu/nagydaniel/mancsbot/MainActivity.java
          sed -i "s/versionCode 1/versionCode 2/" work/MancsBot-KITT-Android/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.1.0-ai'/" work/MancsBot-KITT-Android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: work/MancsBot-KITT-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp work/MancsBot-KITT-Android/app/build/outputs/apk/debug/app-debug.apk MancsBot-KITT-AI-Nagy-Daniel.apk

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MancsBot-KITT-AI-Nagy-Daniel-APK
          path: MancsBot-KITT-AI-Nagy-Daniel.apk

      - name: Publish latest build metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          mkdir -p dist
          APK_SHA256="$(sha256sum MancsBot-KITT-AI-Nagy-Daniel.apk | awk '{print $1}')"
          printf '{"run_id":"%s","artifact_id":"%s","artifact_url":"%s","sha256":"%s","source_commit":"%s"}\n' \
            "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_URL" "$APK_SHA256" "$GITHUB_SHA" > dist/latest-ai-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/latest-ai-build.json
          git commit -m "Publish latest AI APK build metadata [skip ci]"
          git push
